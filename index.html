<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Steno Privacy</title>
        <meta http-equiv="refresh" content="0; url=./privacy/" />
        <meta
            name="description"
            content="Redirecting to the Steno privacy policy."
        />
        <link rel="canonical" href="./privacy/" />
        <script>
            window.location.replace("./privacy/");
        </script>
        <style>
            :root {
                color-scheme: light;
                --bg: oklch(98.4% 0.004 95);
                --ink: oklch(26% 0.015 255);
                --muted: oklch(49% 0.012 255);
                --line: oklch(89% 0.006 95);
                --body:
                    "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica,
                    sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 2rem;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--body);
            }

            main {
                max-width: 32rem;
                padding: 1.25rem 1.4rem;
                border: 1px solid var(--line);
                border-radius: 1rem;
                background: white;
            }

            p {
                margin: 0;
                color: var(--muted);
                line-height: 1.6;
            }

            a {
                color: inherit;
            }
        </style>
    </head>
    <body>
        <main>
            <p>
                Redirecting to the <a href="./privacy/">Steno Privacy Policy</a>.
            </p>
        </main>
    </body>
</html>
